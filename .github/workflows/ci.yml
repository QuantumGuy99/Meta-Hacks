name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv --directory backend sync --locked
      - name: Lint
        run: |
          uv --directory backend run ruff check .
          uv --directory backend run ruff format --check .
      - name: Tests (no network, no keys)
        run: uv --directory backend run pytest -q -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend exec next typegen
      - run: pnpm --dir frontend exec tsc --noEmit
      - name: Node tests (capture / replay)
        run: make test-node

  contracts:
    # Fails if frontend/src/types/contracts.ts is out of date with the Pydantic contracts (PLAN §7.6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv --directory backend sync --locked
      - run: make contracts-check

  docker:
    # Builds the deploy image (never pushed) and boots it, so the Dockerfile is proven long before IC3.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t crucible-backend:ci .
      - name: The image can apply sample fix.patch files
        run: docker run --rm crucible-backend:ci patch --version
      - name: Boot it and hit /api/health
        run: |
          docker run -d --name api -p 8000:8000 -e PORT=8000 -e DATABASE_URL=sqlite:////tmp/crucible.db crucible-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
